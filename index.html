<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="AI-powered chess coach with floating board" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Chess Coach Mini</title>
    <style>
      #install-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        padding: 14px 24px;
        background: #e94560;
        color: white;
        border: none;
        border-radius: 50px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 20px rgba(233, 69, 96, 0.5);
        z-index: 9999;
        display: none;
        align-items: center;
        gap: 8px;
      }
      #install-btn.show {
        display: flex;
      }
      #install-btn:hover {
        background: #ff6b6b;
        transform: scale(1.05);
      }
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #1a1a2e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid #16213e;
        border-top-color: #e94560;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      #loading p {
        color: #a0a0a0;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="spinner"></div>
      <p>Loading Chess Coach...</p>
    </div>

    <div id="root"></div>

    <button id="install-btn" onclick="installApp()">
      📲 Install App
    </button>

    <script>
      let deferredPrompt;
      const installBtn = document.getElementById('install-btn');
      const loading = document.getElementById('loading');

      // Register service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('SW registered'))
          .catch(err => console.log('SW failed:', err));
      }

      // Listen for install prompt
      window.addEventListener('beforeinstallprompt', (e) => {
        console.log('Install prompt available');
        e.preventDefault();
        deferredPrompt = e;
        installBtn.classList.add('show');
      });

      // Hide loading when app loads
      window.addEventListener('load', () => {
        setTimeout(() => {
          loading.style.opacity = '0';
          loading.style.transition = 'opacity 0.5s';
          setTimeout(() => loading.style.display = 'none', 500);
        }, 1000);
      });

      async function installApp() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            installBtn.textContent = '✅ Installed!';
            setTimeout(() => installBtn.classList.remove('show'), 2000);
          }
          deferredPrompt = null;
        } else {
          // For iOS or when prompt not available
          alert('To install:\n\nAndroid: Menu (⋮) → Add to Home Screen\niOS: Share → Add to Home Screen');
        }
      }

      // Show install button after delay if not installed
      setTimeout(() => {
        if (!window.matchMedia('(display-mode: standalone)').matches && !deferredPrompt) {
          installBtn.classList.add('show');
          installBtn.innerHTML = '📲 Install App';
        }
      }, 3000);
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
